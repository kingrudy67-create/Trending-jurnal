<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <meta name="description" content="Jurnal dan kalkulator trading akun cent: USC, USD, IDR, analitik, dan evaluasi.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <title>TradeFlow Cent Journal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: {
      ink:'#08111f', panel:'#101c2e', panel2:'#142238', line:'#263750',
      mint:'#42f5b3', coral:'#ff6b78', muted:'#91a1b8'
    }}}}
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root{color-scheme:dark;--bg:#08111f;--panel:#101c2e;--line:#263750;--mint:#42f5b3;--coral:#ff6b78}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(ellipse at 70% -10%,#172b49 0,transparent 42%),var(--bg);color:#eef5ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}
    button,input,select,textarea{font:inherit} button{touch-action:manipulation}
    .panel{background:linear-gradient(145deg,rgba(20,34,56,.96),rgba(13,25,42,.98));border:1px solid rgba(126,153,190,.14);border-radius:20px}
    .navbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#91a1b8;font-size:10px;font-weight:600;min-width:0;flex:1;padding:10px 2px;border-radius:14px;transition:all .2s}
    .navbtn.active{color:var(--mint);background:rgba(66,245,179,.09)} .navbtn svg{width:19px;height:19px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:13px;padding:11px 14px;font-size:12px;font-weight:700;transition:transform .16s,opacity .16s,background .16s}
    .btn:active{transform:scale(.97)} .btn-primary{background:var(--mint);color:#062018}.btn-ghost{border:1px solid #31435c;background:#142238;color:#e6eefb}.btn-danger{background:rgba(255,107,120,.12);color:#ff929c;border:1px solid rgba(255,107,120,.25)}
    .field{width:100%;background:#091524;border:1px solid #2b3e58;border-radius:12px;padding:12px;color:#eef5ff;outline:none;min-height:44px}
    .field:focus{border-color:var(--mint);box-shadow:0 0 0 3px rgba(66,245,179,.08)}
    .label{display:block;font-size:11px;color:#91a1b8;margin-bottom:6px;font-weight:600}
    .metric-label{font-size:11px;color:#91a1b8}.metric-value{font-size:19px;letter-spacing:-.5px;font-weight:800}
    .muted{color:#91a1b8}.mint{color:var(--mint)}.coral{color:var(--coral)}
    .tabpage{animation:enter .22s ease both}@keyframes enter{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
    .drawer-backdrop{position:fixed;inset:0;background:rgba(1,5,12,.68);z-index:50;display:flex;align-items:flex-end;backdrop-filter:blur(4px)}
    .drawer{width:100%;max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;background:#0d192a;border:1px solid #2b3d56;padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:slide .22s ease}
    @keyframes slide{from{transform:translateY(30px);opacity:.7}to{transform:translateY(0);opacity:1}}
    .pill{padding:5px 8px;border-radius:999px;font-size:10px;font-weight:800;background:#1b2c43;color:#aebdd2}
    .trade-row{border-bottom:1px solid rgba(126,153,190,.12);padding:13px 0}.trade-row:last-child{border-bottom:0}
    .bottom-safe{padding-bottom:calc(5px + env(safe-area-inset-bottom))}
    .hide-scroll::-webkit-scrollbar{display:none}
    canvas{max-width:100%}
    @media(min-width:700px){#app{max-width:760px;margin:0 auto;border-left:1px solid #17263b;border-right:1px solid #17263b;min-height:100dvh}.drawer{max-width:600px;margin:0 auto 12px;border-radius:24px}.drawer-backdrop{align-items:flex-end}}
  </style>
</head>
<body>
<div id="app" class="min-h-screen pb-24">
  <header class="px-5 pt-5 pb-3 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3 min-w-0">
      <div id="avatar" class="w-11 h-11 rounded-2xl bg-panel2 border border-line flex items-center justify-center overflow-hidden shrink-0"><i data-lucide="user-round" class="w-5 h-5 text-muted"></i></div>
      <div class="min-w-0"><p class="text-[10px] uppercase tracking-[.18em] text-muted">TRADING WORKSPACE</p><h1 id="headerName" class="font-extrabold text-lg truncate">Trader</h1></div>
    </div>
    <button id="settingsBtn" class="btn btn-ghost !p-3" aria-label="Pengaturan"><i data-lucide="sliders-horizontal" class="w-4 h-4"></i></button>
  </header>
  <main id="page" class="px-4 pt-2 space-y-4"></main>
  <nav class="fixed bottom-0 inset-x-0 z-40 bg-[#08111f]/95 backdrop-blur-xl border-t border-[#263750] bottom-safe">
    <div class="max-w-[760px] mx-auto flex px-2 pt-2 pb-1">
      <button class="navbtn active" data-tab="home"><i data-lucide="layout-dashboard"></i><span>Home</span></button>
      <button class="navbtn" data-tab="journal"><i data-lucide="notebook-pen"></i><span>Jurnal</span></button>
      <button class="navbtn" data-tab="analytics"><i data-lucide="chart-no-axes-combined"></i><span>Analitik</span></button>
      <button class="navbtn" data-tab="notes"><i data-lucide="book-open-text"></i><span>Evaluasi</span></button>
    </div>
  </nav>
</div>
<div id="modalRoot"></div>
<div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-[80] hidden max-w-[90vw] rounded-xl bg-[#e9fff6] text-[#062018] px-4 py-3 text-xs font-bold shadow-2xl"></div>
<script src="app.js"></script>
</body>
</html>
